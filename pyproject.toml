[project]
name = "google-flights-proto-mcp"
version = "0.1.0"
description = "Standalone protobuf-first Google Flights discovery and verification MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.7.4",
    "fastapi>=0.115.6",
    "fastmcp>=3.2",
    "google-auth[requests]>=2.38",
    "playwright>=1.52.0",
    "protobuf>=5.27",
    "pydantic>=2.10.4",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.8.4",
]

[project.scripts]
google-flights-proto-mcp = "google_flights_proto_mcp.server:run"
google-flights-proto-mcp-http = "google_flights_proto_mcp.server:run_http"
google-flights-proto-web = "google_flights_proto_mcp.web:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_flights_proto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls live Google Flights or a real browser"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
